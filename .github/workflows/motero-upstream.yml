name: Observe Motero upstream
on:
  # Deliberately not at the top of the hour. Runs on the default branch only.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: motero-upstream-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare upstream heads and report new observations
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKING_ISSUE: '15'
        run: node scripts/check-motero-upstream.mjs
